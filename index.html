<main>

<footer>最後更新：2026-11-14</footer>
<script>
document.getElementById('q').addEventListener('input',function(e){
  var k=e.target.value.trim().toLowerCase();
  document.querySelectorAll('#list .card').forEach(function(c){
    c.hidden=k&&c.textContent.toLowerCase().indexOf(k)<0;
  });
});
</script>
