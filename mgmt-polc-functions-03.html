<h1>管理四大功能 POLC</h1><p class="meta"><span class="tag tag-mgmt">管理學</span></p></header>
<main>
<section class="summary"><p>管理者的工作可歸納為規劃、組織、領導、控制，並且是不斷回饋的循環。</p></section>
<section><h2>四大功能</h2>
<table><tr><th>功能</th><th>回答的問題</th></tr>
<tr><td>Planning 規劃</td><td>目標是什麼、怎麼達成</td></tr>
<tr><td>Organizing 組織</td><td>誰做什麼、怎麼分工與報告</td></tr>
<tr><td>Leading 領導</td><td>如何激勵、溝通、帶領人</td></tr>
<tr><td>Controlling 控制</td><td>結果與目標差多少、如何修正</td></tr></table></section>
<section><h2>為什麼是循環</h2><p><mark>控制得到的差異會回到下一輪規劃</mark>，所以四個功能不是一次性的順序，而是持續運轉。</p></section>
<section class="review"><h2>自我檢查</h2>
<details><summary>設定目標屬於哪一項？</summary>規劃。</details>
<details><summary>比較實際績效與標準屬於哪一項？</summary>控制。</details>
<details><summary>激勵員工屬於哪一項？</summary>領導。</details></section>
</main>
